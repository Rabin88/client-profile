<path d="M 880 600 L 830 600 L 830 455 L 782 455" fill="none" stroke="#dc2626" stroke-width="2.25" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<path d="M 600 365 L 600 307" fill="none" stroke="#dc2626" stroke-width="2.25" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
