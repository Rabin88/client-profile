<text x="678" y="978" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Request and data</text>
<path d="M 868 973 L 924 973" fill="none" stroke="#dc2626" stroke-width="2.25" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<text x="936" y="978" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Error path</text>
