<marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0d9488"/></marker>
</defs>
<rect width="1960" height="1040" fill="#ffffff"/>
<text x="40" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">EV Client Profile — GraphQL composition layer</text>
<text x="40" y="94" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start">End-to-end path of one request, from the UI to the two downstream services and back</text>
<rect x="380" y="140" width="1000" height="780" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="408" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">APOLLO GATEWAY</text>
<text x="578" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">·  this project</text>
<rect x="1545" y="300" width="375" height="620" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1570" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="start" letter-spacing="1.5">DOWNSTREAM MICROSERVICES</text>
<text x="1732" y="608" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="middle">Independent services:</text>
<text x="1732" y="630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="middle">no shared database,</text>
<text x="1732" y="652" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="middle">transaction or failure mode</text>
