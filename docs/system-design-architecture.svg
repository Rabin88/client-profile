<rect x="40" y="205" width="230" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="66" y="245" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">UI / GraphQL client</text>
<text x="66" y="271" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Selects only the fields</text>
<text x="66" y="293" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">it needs</text>
<circle cx="40" cy="205" r="17" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
<text x="40" y="210.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="420" y="215" width="920" height="90" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="446" y="255" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Apollo Server</text>
<text x="446" y="281" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Validates the query against the schema  ·  Introspection off outside development  ·  Stack traces never returned</text>
<circle cx="420" cy="215" r="17" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text x="420" y="220.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="880" y="365" width="460" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="906" y="405" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Root resolvers</text>
<text x="906" y="431" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">Query.clientProfile · Query.clients</text>
<text x="906" y="453" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Validate ID format and cap the list at 50</text>
<text x="906" y="475" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">before any downstream call</text>
<circle cx="880" cy="365" r="17" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text x="880" y="370.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="880" y="555" width="460" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="906" y="595" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Field resolver</text>
<text x="906" y="621" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">Client.adviser</text>
<text x="906" y="643" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Runs only when adviser is selected,</text>
<text x="906" y="665" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">once per client returned</text>
<circle cx="880" cy="555" r="17" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text x="880" y="560.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<rect x="880" y="745" width="460" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="906" y="785" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Adviser DataLoader</text>
<text x="906" y="811" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start">context.loaders.adviser</text>
<text x="906" y="833" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Batches and de-duplicates adviser IDs;</text>
<text x="906" y="855" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">a failed ID fails only its own key</text>
<circle cx="880" cy="745" r="17" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text x="880" y="750.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<rect x="420" y="365" width="360" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text x="446" y="405" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">formatError</text>
<text x="446" y="431" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Allow-list of safe error codes;</text>
<text x="446" y="453" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">all others are masked as</text>
<text x="446" y="475" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#dc2626" text-anchor="start">INTERNAL_SERVER_ERROR</text>
<rect x="420" y="555" width="360" height="130" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="446" y="595" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Logger</text>
<text x="446" y="621" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Error codes and record IDs only,</text>
<text x="446" y="643" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">never names or personal data</text>
<rect x="420" y="745" width="360" height="130" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="446" y="785" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Context factory</text>
<text x="446" y="811" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Creates a new DataLoader for every</text>
<text x="446" y="833" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">request, so no cache is shared</text>
<text x="446" y="855" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">between users</text>
<rect x="1570" y="365" width="325" height="130" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="1596" y="405" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">ClientService</text>
<text x="1596" y="431" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#059669" text-anchor="start">getDetails(clientId)</text>
<text x="1596" y="453" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#059669" text-anchor="start">returns { id, firstName,</text>
<text x="1596" y="475" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#059669" text-anchor="start">lastName, adviserId }</text>
<circle cx="1570" cy="365" r="17" fill="#059669" stroke="#ffffff" stroke-width="3"/>
<text x="1570" y="370.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="1570" y="745" width="325" height="130" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="1596" y="785" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">AdviserService</text>
<text x="1596" y="811" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#059669" text-anchor="start">getDetails(adviserId)</text>
<text x="1596" y="833" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="13" font-weight="600" fill="#059669" text-anchor="start">returns { id, name, firm }</text>
<circle cx="1570" cy="745" r="17" fill="#059669" stroke="#ffffff" stroke-width="3"/>
<text x="1570" y="750.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
