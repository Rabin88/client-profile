<text x="345" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">GraphQL query</text>
<rect x="286.25" y="295" width="117.5" height="21" rx="6" fill="#ffffff"/>
<text x="345" y="310" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">data + errors[]</text>
<rect x="1119" y="514" width="179.60000000000002" height="21" rx="6" fill="#f8fafc"/>
<text x="1126" y="529" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">for each client returned</text>
<rect x="1119" y="704" width="129.5" height="21" rx="6" fill="#f8fafc"/>
<text x="1126" y="719" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">load(adviserId)</text>
<rect x="1379.0" y="403" width="152.0" height="21" rx="6" fill="#ffffff"/>
<text x="1455" y="418" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">1 call per client ID</text>
<rect x="1361.75" y="783" width="186.5" height="21" rx="6" fill="#ffffff"/>
<text x="1455" y="798" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">1 call per unique adviser</text>
<rect x="802.3" y="383" width="55.400000000000006" height="21" rx="6" fill="#f8fafc"/>
<text x="830" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#dc2626" text-anchor="middle">errors</text>
<rect x="609" y="326" width="138.2" height="21" rx="6" fill="#f8fafc"/>
<text x="616" y="341" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#dc2626" text-anchor="start">sanitised errors[]</text>
<rect x="809.2" y="618" width="41.6" height="21" rx="6" fill="#f8fafc"/>
<text x="830" y="633" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0d9488" text-anchor="middle">logs</text>
<rect x="785.05" y="783" width="89.9" height="21" rx="6" fill="#f8fafc"/>
<text x="830" y="798" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0d9488" text-anchor="middle">per request</text>
<circle cx="394" cy="973" r="13" fill="#2563eb"/>
<text x="394" y="978" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">n</text>
<text x="416" y="978" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start">Order of the request</text>
